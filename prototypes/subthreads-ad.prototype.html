<!doctype html>
<!-- PROTOTYPE, throwaway. A+D combination of subthreads.prototype.html: icon chips as the family
     summary (A), rows with status left, role icon, title, age right (D), one fold level.
     Rules: every child that is not settled shows (done = green check); settled children all sit behind "+N klaar".
     Collapsed: chips only; a child waiting on Tim, a failed child and the open thread stay visible.
     Left panel: default. Right panel: families collapsed. Third family has only settled children: one "+N klaar" line. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --fg:#e6e8eb; --dim:#8b9096; --faint:#5d6268; --line:#33373c; --blue:#5b9cf6; --green:#4ecb8a; --amber:#e8b44c; --violet:#b48cf6; --row:#25292d; }
  body { margin:0; font-family: var(--font-sans, Inter, system-ui, sans-serif); color:var(--fg); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
  .panel { background:#16191c; border-radius:var(--radius,12px); padding:12px 8px 10px; box-shadow:0 0 0 1px #2a2e32; }
  .vt { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; padding:0 8px 10px; }
  .proj { display:flex; align-items:center; gap:8px; padding:4px 8px 8px; font-weight:600; font-size:13px; }
  .proj .lg { width:18px; height:18px; border-radius:4px; background:#000; font-size:8px; display:grid; place-items:center; }
  svg.i { width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .chip svg.i { width:12px; height:12px; }
  .spin { animation: r 1.6s linear infinite; } @keyframes r { to { transform: rotate(360deg) } }
  .head { padding:6px 8px; border-radius:8px; }
  .head.sel { background:var(--row); }
  .head .t { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
  .head .t span.n { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .head .m { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--dim); margin-top:2px; }
  .st { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:500; }
  .blue{color:var(--blue)} .green{color:var(--green)} .amber{color:var(--amber)} .dim{color:var(--dim)} .faint{color:var(--faint)} .violet{color:var(--violet)} .red{color:#f06a6a}
  .kids { margin:2px 0 8px 14px; border-left:1px solid var(--line); padding-left:6px; }
  .disc { display:flex; align-items:center; gap:6px; padding:3px 6px; cursor:pointer; border-radius:6px; color:var(--dim); }
  .disc:hover, .child:hover { background:#1f2326; }
  .chev { transition:transform .15s; } .kids:not(.collapsed) > .disc .chev { transform:rotate(90deg); }
  .chips { display:flex; gap:4px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:3px; padding:1px 6px 1px 4px; border-radius:99px; background:#22262a; font-size:11px; font-variant-numeric:tabular-nums; }
  .child { display:flex; align-items:center; gap:6px; padding:3px 6px; font-size:12.5px; border-radius:6px; color:#c3c7cc; cursor:default; }
  .child .n { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .child.settled { color:var(--faint); }
  .child.user { color:var(--fg); }
  .child .when { font-size:10.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .more { display:flex; align-items:center; gap:6px; padding:3px 6px; font-size:11.5px; color:var(--faint); cursor:pointer; border-radius:6px; }
  .more:hover { background:#1f2326; color:var(--dim); }
  .more .ri { display:inline-flex; gap:2px; margin-left:2px; }
  .more .ri svg.i { width:11px; height:11px; }
  .collapsed .x { display:none; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--dim); padding:10px 4px 0; }
  .legend span { display:inline-flex; align-items:center; gap:4px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<div class="legend" id="legend"></div>
<script>
const P = {
  chev:'<path d="m9 18 6-6-6-6"/>',
  check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  spin:'<circle cx="12" cy="12" r="10" stroke-dasharray="4 3.2"/>',
  wait:'<circle cx="12" cy="12" r="10" stroke-dasharray="2 4"/><circle cx="12" cy="12" r="1"/>',
  user:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  dotnew:'<circle cx="12" cy="12" r="4" fill="currentColor"/>',
  eye:'<path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  hammer:'<path d="m15 12-8.37 8.37a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.91-1.91A2 2 0 0 1 19 8.17V7l-2.26-2.26a6 6 0 0 0-4.2-1.76L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.17a2 2 0 0 1 1.42.59L18.5 14.5"/>',
  code:'<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
  list:'<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
  pr:'<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/>',
};
const ic = (k, cls='') => `<svg class="i ${cls} ${k==='spin'?'spin':''}" viewBox="0 0 24 24">${P[k]}</svg>`;
const ROLE = {
  review:{icon:'eye', color:'violet', label:'review'},
  fix:{icon:'wrench', color:'amber', label:'herstel'},
  worker:{icon:'hammer', color:'blue', label:'worker'},
  step:{icon:'list', color:'green', label:'stap'},
  build:{icon:'code', color:'dim', label:'bouw'},
};
const roleOf = t => /herstel/i.test(t) ? 'fix' : /^Rev\b/.test(t) ? 'review' : /^W:/.test(t) ? 'worker' : /^S\d+:/.test(t) ? 'step' : 'build';
// order = chip order; user first because it needs Tim.
const STATUS = { approval:['shield','amber','wacht op goedkeuring'], user:['user','amber','wacht op jou'], error:['alert','red','fout'], new:['dotnew','blue','nieuw'], working:['spin','blue','werkt'], done:['check','green','afgerond'], settled:['check','faint','klaar'] };
const FAMILIES = [
  { title:'Uren toevoegen aan werkbon', status:'working', sel:true, diff:'+5', kids:[
    ['S1: MCP werkbon-velden','working','2m'],
    ['Rev #2298 herstel','done','8m'],['Rev #2298','done','14m'],['Rev #2297','settled','22m',true],
    ['W: verify-skill web','settled','31m'],['#2294 annuleren','settled','40m'],['Rev #2296','settled','46m'],
    ['Rev #2295','settled','52m'],['#2294 kopvelden+status','settled','1u'],['#2294 materiaal+werkverslag','settled','1u'],
    ['Rev #2293','settled','1u'],['#2292 MCP werkbon-uren','settled','2u'] ]},
  { title:'Werkbon werkdatum tonen', status:'waiting', diff:'+3', kids:[
    ['S2: migratie','user','1m'],['Rev #2301','new','nu'],['#2300 werkdatum API','working','1m'],['#2300 werkdatum web','working','1m'],
    ['#2300 werkdatum app','approval','2m'],['W: e2e planbord','error','3m'],
    ['#2299 sortering','done','20m'],['Rev #2299','settled','24m'],['Rev #2298','settled','25m'] ]},
  { title:'Planbord export', status:'done', diff:'+1', kids:[
    ['#2288 export CSV','settled','3u'],['Rev #2288','settled','3u'],['W: e2e export','settled','4u'] ]},
].map(f => ({...f, kids:f.kids.map(r => ({title:r[0], status:r[1], when:r[2], open:!!r[3], role:roleOf(r[0])}))}));

const statusIcon = s => ic(STATUS[s][0], STATUS[s][1]);
function head(f) {
  const s = f.status==='done' ? `<span class="st green">${ic('check')}Done</span>` : f.status==='working' ? `<span class="st blue">${ic('spin')}Working</span>` : `<span class="st dim">${ic('wait')}Waiting</span>`;
  return `<div class="head ${f.sel?'sel':''}"><div class="t"><span class="n">${f.title}</span>${s}</div>
    <div class="m">main<span style="flex:1"></span><span class="green">${ic('pr')}</span>${f.diff}</div></div>`;
}
function row(x) {
  const done = x.status==='settled';
  return `<div class="child ${done?'settled':''} ${x.status==='user'?'user':''}" style="${x.open?'background:var(--row);color:var(--fg)':''}" title="${ROLE[x.role].label} · ${STATUS[x.status][2]}">
    ${statusIcon(x.status)}<span class="${done?'faint':ROLE[x.role].color}">${ic(ROLE[x.role].icon)}</span>
    <span class="n">${x.title}</span><span class="when">${x.when}</span></div>`;
}
const moreRow = (n, roles, lead) => `<div class="more" onclick="const o=this.previousElementSibling;const open=o.style.display==='none';o.style.display=open?'':'none';this.querySelector('b').textContent=open?'Minder':'+${n} klaar'">
  ${lead}<b style="font-weight:400">+${n} klaar</b><span class="ri">${[...new Set(roles)].map(r=>ic(ROLE[r].icon)).join('')}</span></div>`;
function family(f, {collapsed=false}={}) {
  const c = {}; f.kids.forEach(x => c[x.status]=(c[x.status]||0)+1);
  const chips = Object.keys(STATUS).filter(s=>c[s]).map(s=>`<span class="chip ${STATUS[s][1]}" title="${c[s]} ${STATUS[s][2]}">${statusIcon(s)}${c[s]}</span>`).join('');
  const order = Object.keys(STATUS);
  const live = f.kids.filter(x=>x.status!=='settled').sort((a,b)=>order.indexOf(a.status)-order.indexOf(b.status));
  const pinned = f.kids.filter(x=>x.status==='settled' && x.open);
  const done = f.kids.filter(x=>x.status==='settled' && !x.open);
  // Only settled children: the "+N klaar" row is the whole family line.
  if (live.length===0 && pinned.length===0) return head(f) + `<div class="kids">
    <div class="older" style="display:none">${done.map(row).join('')}</div>${moreRow(done.length, done.map(x=>x.role), ic('check','faint'))}</div>`;
  return head(f) + `<div class="kids ${collapsed?'collapsed':''}">
    <div class="disc" onclick="this.parentNode.classList.toggle('collapsed')">${ic('chev','chev')}<span class="chips">${chips}</span></div>
    ${live.map(x => `<div class="${['user','approval','error'].includes(x.status)?'':'x'}">${row(x)}</div>`).join('')}${pinned.map(row).join('')}
    <div class="x">${done.length?`<div class="older" style="display:none">${done.map(row).join('')}</div>${moreRow(done.length, done.map(x=>x.role), '<span style="width:14px"></span>')}`:''}</div></div>`;
}
const panel = (title, opts) => `<div class="panel"><div class="vt">${title}</div>
  <div class="proj"><span class="lg">LM</span>timvdhoorn/LMManagement</div>${FAMILIES.map((f,i)=>family(f, opts[i]||{})).join('')}</div>`;
document.getElementById('grid').innerHTML =
  panel('Uitgeklapt', []) +
  panel('Ingeklapt', [{collapsed:true}, {collapsed:true}]);
document.getElementById('legend').innerHTML =
  Object.values(STATUS).map(([i,c,l])=>`<span>${ic(i,c)}${l}</span>`).join('') + '<span class="faint">│</span>' +
  Object.values(ROLE).map(r=>`<span><span class="${r.color}">${ic(r.icon)}</span>${r.label}</span>`).join('');
</script>
</body>
</html>
