<!doctype html>
<!-- PROTOTYPE, throwaway. Question: the boring sidebar indents every thread row ~50px under the
     project icon. Can that left space show more title text? Each panel is the real sidebar width
     (288px). A = today (with the agreed A+D child chips), B-D use the gutter. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --fg:#e6e8eb; --dim:#8b9096; --faint:#5d6268; --line:#33373c; --blue:#5b9cf6; --green:#4ecb8a; --amber:#e8b44c; --violet:#b48cf6; --row:#25292d; }
  body { margin:0; font-family: var(--font-sans, Inter, system-ui, sans-serif); color:var(--fg); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .cap { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin:0 0 4px 2px; }
  .capd { font-size:11.5px; color:var(--faint); margin:0 0 8px 2px; line-height:1.35; min-height:31px; }
  .sb { width:288px; background:#16191c; border-radius:var(--radius,12px); padding:10px 8px; box-shadow:0 0 0 1px #2a2e32; box-sizing:border-box; }
  svg.i { width:14px; height:14px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .chip svg.i { width:12px; height:12px; }
  .spin { animation: r 1.6s linear infinite; } @keyframes r { to { transform: rotate(360deg) } }
  .blue{color:var(--blue)} .green{color:var(--green)} .amber{color:var(--amber)} .dim{color:var(--dim)} .faint{color:var(--faint)} .violet{color:var(--violet)}
  .proj { display:flex; align-items:center; gap:10px; padding:8px 6px 6px; font-weight:600; font-size:13.5px; }
  .proj .lg { width:20px; height:20px; border-radius:5px; font-size:8.5px; font-weight:700; display:grid; place-items:center; flex:none; }
  .proj .pn { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .th { position:relative; border-radius:8px; padding:6px 6px; display:grid; gap:2px 6px; }
  .th.sel { background:var(--row); }
  .tt { font-size:13px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:#d5d8dc; }
  .sel .tt { color:var(--fg); font-weight:500; }
  .meta { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--dim); min-width:0; }
  .meta .br { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .st { display:inline-flex; align-items:center; gap:4px; font-size:12px; white-space:nowrap; }
  .av { width:16px; height:16px; border-radius:50%; background:#2a1f1a; color:#d97757; font-size:7px; font-weight:700; display:grid; place-items:center; flex:none; }
  .kids { border-left:1px solid var(--line); padding-left:6px; margin:1px 0 6px; }
  .disc { display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:6px; color:var(--dim); }
  .chips { display:flex; gap:4px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:3px; padding:1px 6px 1px 4px; border-radius:99px; background:#22262a; font-size:11px; font-variant-numeric:tabular-nums; }
  .child { display:flex; align-items:center; gap:6px; padding:3px 6px; font-size:12.5px; border-radius:6px; color:#c3c7cc; }
  .child .n { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .child .when { font-size:10.5px; color:var(--faint); }
  .more { display:flex; align-items:center; gap:6px; padding:3px 6px; font-size:11.5px; color:var(--faint); }
  .wrap2 { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.3; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
const P = {
  chev:'<path d="m9 18 6-6-6-6"/>', chevd:'<path d="m6 9 6 6 6-6"/>',
  check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  spin:'<circle cx="12" cy="12" r="10" stroke-dasharray="4 3.2"/>',
  wait:'<circle cx="12" cy="12" r="10" stroke-dasharray="2 4"/><circle cx="12" cy="12" r="1"/>',
  dotnew:'<circle cx="12" cy="12" r="4" fill="currentColor"/>',
  eye:'<path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  hammer:'<path d="m15 12-8.37 8.37a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.91-1.91A2 2 0 0 1 19 8.17V7l-2.26-2.26a6 6 0 0 0-4.2-1.76L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.17a2 2 0 0 1 1.42.59L18.5 14.5"/>',
  code:'<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
  list:'<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
  pr:'<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/>',
  term:'<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M6 12h.01"/>',
};
const ic = (k, cls='') => `<svg class="i ${cls} ${k==='spin'?'spin':''}" viewBox="0 0 24 24">${P[k]}</svg>`;
const ROLE = { review:['eye','violet'], fix:['wrench','amber'], worker:['hammer','blue'], step:['list','green'], build:['code','dim'] };
const roleOf = t => /herstel/i.test(t) ? 'fix' : /^Rev\b/.test(t) ? 'review' : /^W:/.test(t) ? 'worker' : /^S\d+:/.test(t) ? 'step' : 'build';
const STATUS = { new:['dotnew','blue','New'], working:['spin','blue','Working'], waiting:['wait','dim','Waiting'], done:['check','green','Done'], settled:['check','faint','klaar'] };

const DATA = [
  { name:'timvdhoorn/LMManagement', logo:'LM', bg:'#000', fg:'#fff', threads:[
    { title:'Werkbon werkdatum tonen op planbord', status:'waiting', branch:'main', diff:'+4', open:false, kids:[
      ['Rev #2301','new'],['#2300 werkdatum API','new'],['#2300 werkdatum web','new'],['#2300 werkdatum app','new'],['W: e2e planbord','new'],['Rev #2299','new'],['S2: migratie','working'],['#2299 sortering','settled'],['Rev #2298','settled'] ]},
    { title:'Uren toevoegen aan werkbon via MCP', status:'time', time:'1m', branch:'main', diff:'+8', open:true, kids:[
      ['S1: MCP werkbon-velden','new'],['Rev #2298 herstel','new'],
      ['Rev #2298','settled'],['Rev #2297','settled'],['W: verify-skill web','settled'],['#2294 annuleren','settled'],['Rev #2296','settled'],['Rev #2295','settled'],['#2294 kopvelden+status','settled'],['#2294 materiaal+werkverslag','settled'],['Rev #2293','settled'],['#2292 MCP werkbon-uren','settled'],['Rev #2291','settled'] ]},
  ]},
  { name:'t3code-customize-tt', logo:'T3', bg:'#1d3a1f', fg:'#e8d44c', threads:[
    { title:'Subthreads overzichtelijker maken', status:'working', branch:'main', sel:true, kids:[] } ]},
  { name:'No project', logo:'', bg:'transparent', fg:'#8b9096', dashed:true, threads:[
    { title:'Repo-sync via Syncthing opschonen', status:'waiting', branch:'devbox1', host:true, open:true, kids:[['W: Syncthing-conflicten fixen','working']] } ]},
  { name:'timvdhoorn/Growery-CV-Printer', logo:'GP', bg:'#3a2f12', fg:'#e8b44c', threads:[
    { title:'Printfouten: lege labels, dubbele prints', status:'time', time:'3h', branch:'release/test', kids:[] } ]},
];
DATA.forEach(p => p.threads.forEach(t => t.kids = t.kids.map(([title,status]) => ({title,status,role:roleOf(title)}))));

const statusFull = t => t.status==='time' ? `<span class="st faint">${t.time}</span>` : `<span class="st ${STATUS[t.status][1]}">${ic(STATUS[t.status][0])}${STATUS[t.status][2]}</span>`;
const statusIcon = t => t.status==='time' ? `<span class="faint" style="font-size:11px;width:16px;text-align:center">${t.time}</span>` : `<span class="${STATUS[t.status][1]}" title="${STATUS[t.status][2]}">${ic(STATUS[t.status][0])}</span>`;
const metaRight = t => `${t.diff?`<span class="green">${ic('pr')}</span>${t.diff}`:''}<span class="dim">${ic('term')}</span><span class="av">CT</span>`;
const projRow = p => `<div class="proj"><span class="lg" style="background:${p.bg};color:${p.fg};${p.dashed?'border:1.5px dashed #6b7076;width:16px;height:16px':''}">${p.logo}</span><span class="pn">${p.name}</span><span class="dim">${ic('chevd')}</span></div>`;

function kids(t, indent) {
  if (!t.kids.length) return '';
  const c = {}; t.kids.forEach(x => c[x.status]=(c[x.status]||0)+1);
  const chips = ['new','working','done','settled'].filter(s=>c[s]).map(s=>`<span class="chip ${STATUS[s][1]}">${ic(STATUS[s][0])}${c[s]}</span>`).join('');
  const live = t.kids.filter(x=>x.status!=='settled'), settled = t.kids.filter(x=>x.status==='settled');
  const rows = !t.open ? '' : live.map(x=>`<div class="child">${ic(STATUS[x.status][0], STATUS[x.status][1])}<span class="${ROLE[x.role][1]}">${ic(ROLE[x.role][0])}</span><span class="n">${x.title}</span></div>`).join('')
    + (settled.length?`<div class="more"><span style="width:14px"></span>+${settled.length} klaar</div>`:'');
  return `<div class="kids" style="margin-left:${indent}px"><div class="disc">${ic(t.open?'chevd':'chev')}<span class="chips">${chips}</span></div>${rows}</div>`;
}

// A: today. Row text starts under the project name (gutter of ~30px + row padding), status label right.
function A(t) {
  return `<div class="th ${t.sel?'sel':''}" style="padding-left:36px;grid-template-columns:1fr auto">
    <span class="tt">${t.title}</span>${statusFull(t)}
    <div class="meta" style="grid-column:1/-1"><span class="br">${t.branch}</span>${metaRight(t)}</div></div>` + kids(t, 22);
}
// B: status icon moves into the gutter (under the project icon); title gets the full width.
function B(t) {
  return `<div class="th ${t.sel?'sel':''}" style="grid-template-columns:20px 1fr;padding-left:6px">
    <span style="display:grid;place-items:center">${statusIcon(t)}</span><span class="tt">${t.title}</span>
    <span></span><div class="meta"><span class="br">${t.branch}</span>${metaRight(t)}</div></div>` + kids(t, 15);
}
// C: rows flush with the project icon, no gutter; status label moves to the meta line.
function C(t) {
  return `<div class="th ${t.sel?'sel':''}" style="padding-left:6px">
    <span class="tt">${t.title}</span>
    <div class="meta">${statusFull(t)}<span class="faint">·</span><span class="br">${t.branch}</span>${metaRight(t)}</div></div>` + kids(t, 10);
}
// D: B plus the title may wrap to two lines.
function D(t) {
  return `<div class="th ${t.sel?'sel':''}" style="grid-template-columns:20px 1fr;padding-left:6px;align-items:start">
    <span style="display:grid;place-items:center;padding-top:1px">${statusIcon(t)}</span><span class="tt wrap2">${t.title}</span>
    <span></span><div class="meta"><span class="br">${t.branch}</span>${metaRight(t)}</div></div>` + kids(t, 15);
}
const V = [
  ['A · Nu','Inspringing onder de projectnaam, statuslabel rechts naast de titel.', A],
  ['B · Status in de goot','Statusicoon onder het projecticoon; titel loopt tot de rechterrand.', B],
  ['C · Geen inspringing','Rij begint bij het projecticoon; status als tekst op de tweede regel.', C],
  ['D · Goot + 2 regels titel','Als B, maar een lange titel loopt door op een tweede regel.', D],
];
document.getElementById('grid').innerHTML = V.map(([n,d,fn]) => `<div><div class="cap">${n}</div><div class="capd">${d}</div>
  <div class="sb">${DATA.map(p => projRow(p) + p.threads.map(fn).join('')).join('')}</div></div>`).join('');
</script>
</body>
</html>
